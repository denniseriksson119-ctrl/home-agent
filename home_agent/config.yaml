name: Home Agent
version: "0.8.8"
slug: home_agent
description: Local Home Agent service for Home Assistant
url: https://github.com/denniseriksson119-ctrl/home-agent
arch:
  - aarch64
startup: application
boot: auto
init: false
map:
  - type: data
    read_only: false
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Home Agent web interface
webui: http://[HOST]:[PORT:8099]
options:
  google_drive:
    client_id: ""
    client_secret: ""
    expected_email: ""
schema:
  google_drive:
    client_id: str
    client_secret: password
    expected_email: str

