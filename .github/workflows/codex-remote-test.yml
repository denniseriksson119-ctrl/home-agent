name: Codex Remote Test
on:
  pull_request:
    paths: ['codex_remote_test/**', 'home_agent/**', 'tests/test_codex*.py', 'scripts/codex_read_smoke.py', 'scripts/codex_development_smoke.py', 'scripts/check_codex_test_version.py', '.github/workflows/codex-remote-test.yml']
  push:
    branches: [main]
    paths: ['codex_remote_test/**', 'home_agent/**', 'tests/test_codex*.py', 'scripts/codex_read_smoke.py', 'scripts/codex_development_smoke.py', 'scripts/check_codex_test_version.py', '.github/workflows/codex-remote-test.yml']
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6,<7'
      - if: github.event_name == 'pull_request'
        run: python scripts/check_codex_test_version.py --base "${{ github.event.pull_request.base.sha }}"
      - run: python -m py_compile codex_remote_test/app/*.py
      - run: python -m unittest discover -s tests -p 'test_codex*.py' -v
  container:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build with a conflicting Supervisor-style base argument
        run: docker build --build-arg BUILD_FROM=alpine:3.22 --tag codex-remote-test:ci ./codex_remote_test
      - name: Verify Debian base and Node despite the conflicting argument
        run: docker run --rm --network none --entrypoint /bin/sh codex-remote-test:ci -c 'test -f /etc/debian_version && command -v apt-get && command -v npm'
      - name: Start isolated container without network or account
        run: |
          docker volume create codex-test-data
          docker run --detach --name codex-test --network none --mount source=codex-test-data,target=/data codex-remote-test:ci
      - name: Real CLI, web and persistence smoke test
        run: |
          docker exec codex-test python3 /app/smoke.py
          docker exec codex-test python3 /app/smoke.py --seed-auth
          docker restart codex-test
          docker exec codex-test python3 /app/smoke.py --after-restart --expect-auth
      - name: Build Home Agent and connect only an internal test network
        run: |
          arch=amd64
          if [ "$(uname -m)" = aarch64 ]; then arch=aarch64; fi
          docker build --build-arg BUILD_FROM=ghcr.io/home-assistant/$arch-base:3.21 --tag home-agent:ci ./home_agent
          docker network create --internal codex-read-ci
          docker rm --force codex-test
          docker run --detach --name codex-test --network codex-read-ci --mount source=codex-test-data,target=/data codex-remote-test:ci
          docker exec codex-test python3 /app/smoke.py --after-restart --expect-auth
          docker run --detach --name home-agent-read --hostname local-home-agent --network codex-read-ci --network-alias local-home-agent home-agent:ci
          docker cp scripts/codex_read_smoke.py home-agent-read:/tmp/codex_read_smoke.py
          docker exec home-agent-read python3 /tmp/codex_read_smoke.py seed
          docker cp home-agent-read:/data/ci-ticket /tmp/ci-ticket
          docker cp /tmp/ci-ticket codex-test:/tmp/ci-ticket
          docker cp scripts/codex_read_smoke.py codex-test:/tmp/codex_read_smoke.py
          docker exec codex-test chown 10001:10001 /tmp/ci-ticket
      - name: Read actual PDF and PNG through MCP and the authenticated service
        run: |
          docker exec codex-test setpriv --reuid=10001 --regid=10001 --init-groups python3 /tmp/codex_read_smoke.py verify
          docker restart codex-test
          docker exec codex-test python3 /app/smoke.py --after-restart --expect-auth
          docker exec codex-test setpriv --reuid=10001 --regid=10001 --init-groups python3 /tmp/codex_read_smoke.py resumed
          docker exec home-agent-read python3 /tmp/codex_read_smoke.py unchanged
      - name: Develop and run full project tests inside the add-on without network egress
        run: |
          git archive --format=tar HEAD > /tmp/codex-source.tar
          docker cp /tmp/codex-source.tar codex-test:/tmp/codex-source.tar
          docker cp scripts/codex_development_smoke.py codex-test:/tmp/codex_development_smoke.py
          docker exec codex-test setpriv --reuid=10001 --regid=10001 --init-groups python3 /tmp/codex_development_smoke.py
          docker restart codex-test
          docker exec codex-test python3 /app/smoke.py --after-restart --expect-auth
          docker exec codex-test setpriv --reuid=10001 --regid=10001 --init-groups python3 /tmp/codex_development_smoke.py --after-restart
      - name: Container diagnostics on failure
        if: failure()
        run: |
          docker logs home-agent-read || true
          docker logs codex-test || true
      - name: Stop and remove synthetic test data
        if: always()
        run: |
          docker rm --force codex-test || true
          docker rm --force home-agent-read || true
          docker volume rm codex-test-data || true
          docker network rm codex-read-ci || true
